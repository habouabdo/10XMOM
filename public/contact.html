<!doctype html>
<html lang="en">
<head>
<!-- @head -->
<title>Contact – 10x MoM</title>
<meta name="description" content="Talk to 10x MoM on WhatsApp about your laundry order, our service areas or becoming a Mom.">
</head>
<body>
<!-- @header -->
<main id="main">
  <section class="page-hero">
    <div class="narrow">
      <span class="eyebrow">Contact</span>
      <h1>We're one message away</h1>
      <p class="lead">WhatsApp is the fastest way to reach us about bookings, pricing or your order.</p>
    </div>
  </section>
  <section class="section pt-0">
    <div class="narrow grid-2">
      <div class="card">
        <h2 class="h3">WhatsApp</h2>
        <p class="muted">Questions, changes to a pickup, or anything else.</p>
        <a class="btn btn-wa" data-wa="Hi 10x MoM!" hidden href="#">Chat on WhatsApp</a>
      </div>
      <div class="card">
        <h2 class="h3">Your order</h2>
        <p class="muted">Already booked? Check where your clothes are.</p>
        <a class="btn btn-ghost" href="/track">Track an order</a>
        <p class="footer-small" data-email hidden></p>
      </div>
    </div>
  </section>
</main>
<!-- @footer -->
</body>
</html>
